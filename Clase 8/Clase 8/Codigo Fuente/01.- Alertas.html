<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Alertas
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <!-- <link rel="stylesheet" href="../Extra1/bootstrap-5.3.8-dist (1)/bootstrap-5.3.8-dist/css/bootstrap.min.css"> -->
         <link rel="stylesheet" href="../bootstrap-5.3.8-dist (1)/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    </head>
    <body>

        <div class="container">
            <div class="row">
                <div class="col">
                    <!-- Colores Disponibles:
                     .alert-primary: Azul (Informativa General).
                     .alert-secondary: Gris (Neutra).
                     .alert-succes: Verde (éxito, confirmaciones).
                     .alert-danger: Rojo (Errores, Peligros).
                     .alert-warning: Amarillo (Advertencias, Precauciones).
                     .alert-info: Celeste (Información Adicional).Gris muy claro.
                     .alert-dark: Negro/Gris Oscuro.
                     -->
                    <div class="alert alert-primary m-3 p-3">
                        Información Básica sin detalle.
                    </div>
                    <div class="alert alert-success m-3 p-3">
                        ¡Completado!
                    </div>
                    <div class="alert alert-secondary m-3 p-3">
                        Sin Relevancia
                    </div>
                    <div class="alert alert-warning m-3 p-3">
                        Con cuidado!!
                    </div>
                    <div class="alert alert-danger m-3 p-3">
                        ¡Te estas equivocando!
                    </div>
                    <div class="alert alert-info m-3 p-3">
                        Informate
                    </div>
                    <div class="alert alert-light m-3 p-3">
                        Luzz
                    </div>
                    <div class="alert alert-dark m-3 p-3">
                        Dark
                    </div>
                    <hr>
                    <div class="alert alert-danger m-3 p-3 alert-dismissible fade show">
                        <h3>Alerta Descartable</h3> 
                        <hr>
                        Alerta que se puede descartar
                        <button class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                </div>
            </div>
        </div>
        
    
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
         <!-- <script src="../Extra1/bootstrap-5.3.8-dist (1)/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script> -->
    </body>
</html>
