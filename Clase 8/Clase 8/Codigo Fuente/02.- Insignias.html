<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Badges</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <!-- <link rel="stylesheet" href="../Extra1/bootstrap-5.3.8-dist (1)/bootstrap-5.3.8-dist/css/bootstrap.min.css"> -->
        <link rel="stylesheet" href="../bootstrap-5.3.8-dist (1)/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    </head>
    <body>

        <div class="container">
            <div class="row">
                <!-- m-*: Margen en todos los lados arriba, abajo, izquierda, derecha.
                 mt-1: Margen superior pequeño.
                 mt-2: Margen superior mediano-bajo
                 mt-3: Margen superior estándar (el predeterminado).
                 mt-4: Margen superior grande.  -->
                <div class="col-12 m-4">
                    <span class=" badge bg-info p-2">Primary</span>
                    <span class="badge bg-dark p-2 rounded-pill">Secondary</span>
                </div>

                <!-- Se pueden colocar insignias al botón dentro de un boton con un contador dentro.
                 Para ello se deben combinar las clases: 
                 position-relative: convierte al botón en el contador de referencia.
                 position-absolute: saca a la insignia del flujo normal de la página. Esto permite moverla
                 libremente por encima del botón sin que empuje al texto o altere el diseño.
                 top-0: empuja la insignia hacia la derecha, colocándola exactamente en el 100% del ancho del botón
                 (es decir, justo en su borde derecho exterior).
                 translate-middle: para centrar la insignia en la relación al punto de referencia. -->
                <div class="col-2">
                    <button type="button" class="btn btn-primary position-relative">
                Mensajes
                <!-- Insignia con contador -->
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">5
                    <span class="visually-hidden">Mensajes no leídos</span>
                </span>
                    </button>
                </div>
            </div>
        </div>
        <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script> -->
         <script src="../Extra1/bootstrap-5.3.8-dist (1)/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
