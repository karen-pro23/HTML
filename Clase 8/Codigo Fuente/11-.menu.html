<!doctype html>
<html lang="es">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../Estilos/Estilos/css/bootstrap.min.css.map">
    <title>Menú de navegación</title>

<body>
 <!-- .nav: es la clase principal para a un contenedor por lo general un
    <ul>.
        .nav-item: se usa para cada elemento de la lista de navegación.
        .nav-link: da el estilo base de enlace de navegación.
        .active: destaca la pestaña o enlace seleccionado actualmente.
        .disabled: desactiva la interacción con el enlace y le da un aspecto
        atenuado.
        .navbar-toggler: es la clase encargada de dar estilo y funcionalidad
        al botón con las tres líneas horizontales que aparece en los
        teléfonos móviles o pantallas pequeñas.
    navbar-expand-sm: se expande desde pantallas pequeñas en adelante.
    navbar-expand-md: se expande desde tablets en adelante.
    navbar-expand-lg: se expande desde laptops pequeñas en adelante, es
    la más común y recomendada.
    navbar-expand-xl: se expande solo en pantallas muy grandes.
    navbar-expand: hace que nunca se colapse, siempre se muestra
    extendido, sin importar si es un celular.--> 

    <body style="padding-top: 200px;">
        <div class="container-fluid">
            <a href="#" class="navbar-brand">menu</a>

            <!-- menu hamburgesa para moviles -->
             <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-ingenieria"></button>
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
        <div class="collapse navbar-collapse" id="menu-ingenieria">
            <ul class="navbar-nav">

                </li>
                
            </ul>

            <li class="nav-item dropdown">
                <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false
                id="menu-desplegable-ingenieria">Areas</a>
                <ul class="dropdown-menu">
                    <li><a href="#" class="dropdown-item">Arquitectura</a></li>
                    <li><a href="#" class="dropdown-item"> Desarrollo Web</a></li>
                    <li><a href="#" class="dropdown-item">Diseño grafico</a></li>
                     <li><a href="#" class="dropdown-item">Marketing Digital</a></li>
                     <li><a href="#" class="dropdown-item">oficios</a></li>
                     <li><a href="#" class="dropdown-item">idiomas</a></li>
                </ul>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">Empresa</a>
                <a href="#" class="nav-link">Contacto</a>
            </li>
        </div>
        <div class="container">
            div class="row">

                </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
        var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl)
        })
    </script>
