<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Tooltips</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <!-- <link rel="stylesheet" href="../Extra1/bootstrap-5.3.8-dist (1)/bootstrap-5.3.8-dist/css/bootstrap.min.css"> -->
        <link rel="stylesheet" href="../bootstrap-5.3.8-dist (1)/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    </head>
    <body>

        <div class="container">
            <!--  -->
            <div class="row m-5">
                <div class="col">
                    <button type="button" class="btn btn-danger" data-bs-toggle="tooltip" data-bs-placement="left"
                    title="Tooltip Izquierda">Botón</button>

                    <button type="button" class="btn btn-success" data-bs-toggle="tooltip" data-bs-placement="top"
                    title="Tooltip Arriba">Botón</button>

                    <button type="button" class="btn btn-warning" data-bs-toggle="tooltip" data-bs-placement="right"
                    title="Tooltip Derecha">Botón</button>

                    <button type="button" class="btn btn-info" data-bs-toggle="tooltip" data-bs-placement="bottom"
                    title="Tooltip Abajo">Botón</button>
                </div>
            </div>
        </div>
        <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script> -->
         <script src="../Extra1/bootstrap-5.3.8-dist (1)/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
