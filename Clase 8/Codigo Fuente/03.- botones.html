<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Badges</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <!-- <link rel="stylesheet" href="../Extra1/bootstrap-5.3.8-dist (1)/bootstrap-5.3.8-dist/css/bootstrap.min.css"> -->
        <link rel="stylesheet" href="../bootstrap-5.3.8-dist (1)/bootstrap-5.3.8-dist/css/bootstrap.min.css">
     </head>
    <body>

        <div class="container">
            <div class="row mt-3">
                <hr>
                <div class="col-12 m-4">
                    <!-- Botones de colores sólidos: clase basica .btn
                     .btn-primary: azul principal.
                     .btn-secondary: gris secundario.
                     .btn-succcess: verde, se usa para acciones positivas o éxito.
                     .btn-danger: rojo, se usa para eliminar o acciones criticas.
                     .btn-warning: amarillo, se usa para advertencias.
                     .btn-info: celeste: se usa para información.
                     .btn-light: blanco o gris muy claro
                     .btn-dark: negro o gris oscuro.
                     .btn-link: hace que un botón parezca un enlace de texto común. -->

                    <input type="button" class="btn btn-primary" value="Hecho">
                    <input type="button" class="btn btn-secondary" value="Cancelar">
                    <input type="button" class="btn btn-success" value="Aceptar">
                    <input type="button" class="btn btn-danger" value="Estas seguro?">
                    <input type="button" class="btn btn-warning" value="Cuidado">
                    <input type="button" class="btn btn-info" value="Atencion Informate">
                    <input type="button" class="btn btn-light" value="Ignora">
                    <input type="button" class="btn btn-dark" value="Cancelar">
                    <input type="button" class="btn btn-link" value="Enlace">
                    <hr>
                </div>
                <hr>
                <div class="col-12 m-4">
                    <!-- .btn-group es la clase para agrupar botones horizontalmente -->
                     <div class="btn-group">
                        <button class="btn btn-success">Botón</button>
                        <button class="btn btn-success">Botón</button>
                        <button class="btn btn-success">Botón</button>
                        <button class="btn btn-success">Botón</button>

                        <hr>
                        <!-- Botones de Contorno 
                         btn-outline-primary: Azul principal.
                         btn-outline-secondary: Gris secundario.
                         btn-outline-succes: verde.
                         btn-outline-danger: rojo.
                         btn-outline-warning: amarillo.
                         btn-outline-info: celeste.
                         btn-outline-light: blanco o claro, muy usado cuando la pagina tiene un fondo oscuro, ya que las letras y bordes se vuelven blancos.
                         btn-outline-dark: oscuro o negro.
                         -->

                         <button class="btn btn-md btn-outline-primary">Botón</button>
                         <button class="btn btn-md btn-outline-secondary">Botón</button>
                         <button class="btn btn-md btn-outline-success">Botón</button>
                         <button class="btn btn-md btn-outline-danger">Botón</button>
                         <button class="btn btn-md btn-outline-warning">Botón</button>
                         <button class="btn btn-md btn-outline-info">Botón</button>
                         <button class="btn btn-md btn-outline-light">Botón</button>
                         <button class="btn btn-md btn-outline-dark">Botón</button>

                         <hr>

                         <!-- Tamaños de botones: se usan dos clases btn-lg btn-sm
                          .btn-lg: botón grande.
                          (Sin clase): tamaño normal por defecto.
                          .btn-sm: botón pequeño -->

                          <input type="submit" class=" btn btn-dark" value="submit">
                          <button class="btn btn-sm btn-primary">Botón</button>
                          <!-- Los botones pueden estar desabilitados -->
                           <button class="btn btn-lg disabled btn-info">Botón</button>
                     </div>
                     <hr>

                     
                </div>
                <hr>
                <div class="col-12 m-4">
                    <!-- .btn-group-vertical es la clase para agrupar botones verticalmente -->
                     <div class="btn-group-vertical">
                        <button class="btn btn-danger">Botón</button>
                        <button class="btn btn-danger">Botón</button>
                        <button class="btn btn-danger">Botón</button>
                        <button class="btn btn-danger">Botón</button>
                     </div>
                </div>
            </div>
        </div>

        <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script> -->
         <script src="../Extra1/bootstrap-5.3.8-dist (1)/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
