<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- Bootstrap 5 CSS -->
    <link href="../Estilos/Estilos/css/bootstrap.min.css" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <!-- toast-container: Es la clase obligatoria que envuelve a las notificaciones. Se
    encarga de estructurar el espacio para que los toasts floten y se organicen
    correctamente en la pantalla.  

    ​position-absolute: es una clase de posicionamiento, hace que el contenedor se
    posicione de forma absoluta respecto a su elemento padre más cercano.

    ​toast:es la clase principal que convierte a un elemento HTML en una tarjeta de
    notificación emergente define los bordes redondeados, el fondo, la sombra y las
    transiciones.  

    ​show: Obliga a que la notificación sea visible inmediatamente por defecto, los toasts
    vienen ocultos y necesitan esta clase o un disparador de JavaScript para mostrarse. 

    ​toast-header: crea la sección superior de la notificación. Funciona como una barra de
    título que agrupa los elementos de control título, tiempo transcurrido y botón de
    cierre

    me-aunto empuja todos los elementos hacia la derecha, alineando el contenido a la derecha del contenedor.
-->
    <div class="toast-container position-absolutep-3" style="right: 0; bottom:0;">
        <div id="miToast" class="toast show" role="alert" aria-live="assertive" aria-atomic="true" data -bs-delay="5000">
            <div class="toast-header">
                <strong class="me-auto">Notificación</strong>
                <small>Hace 1 minuto</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body">
                ¡Hola! Esta es una notificación emergente.
            </div>
        </div>
     </div>

       <!-- Bootstrap 5 JS  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var toastElement = document.getElementById('miToast');
            var toast = new bootstrap.Toast(toastElement);
            toast.show();
        });
    </script>
    
</body>
</html>
