    <!-- display determina como se comprots un elemento ene le documento respecto al 
     flujo del doseño y los elememtos que lo todean, definiendo basicamente su tipo de 
     caja de renderizado -->
     <!-- valores display -->
      <!-- none: el elemento no se muestra y no ocupa espacio en el diseño
       incline: elemento se muestra en linea con el texto circulante
       block: el elemento se muestra en linea pero puede tener un ancho y alto definidos 
       incline- block; el elemento se muestra en linea pero puede rener un ancho y alto definidos  -->

       <!-- div, visualizar en linea bloque div celeste visualizar en linea bloque div.gris.
        visualizar en linea bloque div morado vizualizar en linea bloque -->
