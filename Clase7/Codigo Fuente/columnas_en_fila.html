<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap es un framework o plantilla que facilita el uso de sistemas de rejilla responsive. Contiene en esencia tres grupos principales: sistemas de rejilla (filas y columnas), componentes(botones, textos, formularios, alertas, modales) y utilidades (colores, márgenes, rellenos, alineaciones). -->
	<!-- Página de Bootstrap https://getbootstrap.com/ -->
	<!-- Enlace Local Archivos Descargados -->
	<!-- <link rel="stylesheet" href="../Estilos/css/bootstrap.min.css"> -->
	<!--Enlace del CSS de Bootstrap (Debe ir siempre en el <head>) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<link rel="stylesheet" href="../Estilos/columnas_en_fila.css">
</head>
<body>
    <div class="container">
        <!-- asigancion de colimnas a una fila -->
        <!-- row: es la clase base obligartoria que convierte al contenedor en una fila flexible (utilizada flebox)
        para alienar y acomodar conrrectamente a las columnas que van en su interior  -->
        <!-- row-cols-4 es un moduficador que le indica a la fila qie todos los elementos hijos directos se deben dividir 
        automaticamente en 4 columnas oir cada liena (es decir, cada hijo ocupara el 25% del ancho disponible)-->

           <!-- div.row.row-cols-4>div.columna-interna*12{columna interna n°$} -->
            <div class="row row-cols-4">
                <div class="columna-interna">columna interna n°1</div>
                <div class="columna-interna">columna interna n°2</div>
                <div class="columna-interna">columna interna n°3</div>
                <div class="columna-interna">columna interna n°4</div>
                <div class="columna-interna">columna interna n°5</div>
                <div class="columna-interna">columna interna n°6</div>
                <div class="columna-interna">columna interna n°7</div>
                <div class="columna-interna">columna interna n°8</div>
                <div class="columna-interna">columna interna n°9</div>
                <div class="columna-interna">columna interna n°10</div>
                <div class="columna-interna">columna interna n°11</div>
                <div class="columna-interna">columna interna n°12</div>
            </div>
    </div>
    

    <!--Enlace del JS de Bootstrap (Debe ir siempre antes de cerrar el <body>) -->
	<!-- JS en modo local -->
	<!-- <script src="js/bootstrap.bundle.min.js"></script> -->
	<!-- JS en internet -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
