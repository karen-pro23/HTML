<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anidaminetos de columnas</title>
        <!-- Bootstrap es un framework o plantilla que facilita el uso de sistemas de rejilla responsive. Contiene en esencia tres grupos principales: sistemas de rejilla (filas y columnas), componentes(botones, textos, formularios, alertas, modales) y utilidades (colores, márgenes, rellenos, alineaciones). -->
	<!-- Página de Bootstrap https://getbootstrap.com/ -->
	<!-- Enlace Local Archivos Descargados -->
	<!-- <link rel="stylesheet" href="../Estilos/css/bootstrap.min.css"> -->
	<!--Enlace del CSS de Bootstrap (Debe ir siempre en el <head>) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<link rel="stylesheet" href="../Estilos/Columnas_anidadas.css">
</head>
<body>

    <div class="container">
        <!-- anidamiento de columnas -->
         <div class="row">
            <!-- col-12 en pantallas pequeñas como tlf moviles, la columna ocupara el 100% del ancho
             disponible(las 12 columnas completas del sistema) -->
             <!-- col-md-6: en pantallas medianas y gran des a partir de 768px hacia arriba, como tablets
              y computadoras la colimna ocupara la mirad del ancho 6 de 12 columnas permitiendo que dos
              elementos de estos queden lado a lado en la misma fila -->

              <!-- (.columna-principal.col-12.col-md-6{columna principal n°$}>div.row>(div.columna-interna.col-12.col-md-3{columna interna N°$})*3)*2 -->
            <div class="columna-principal col-12 col-md-6">columna principal n°1
                <div class="row">
                    <div class="columna-interna col-12 col-md-3">columna interna N°1</div>
                    <div class="columna-interna col-12 col-md-3">columna interna N°2</div>
                    <div class="columna-interna col-12 col-md-3">columna interna N°3</div>
                </div>
            </div>
            <div class="columna-principal col-12 col-md-6">columna principal n°2
                <div class="row">
                    <div class="columna-interna col-12 col-md-4">columna interna N°1</div>
                    <div class="columna-interna col-12 col-md-4">columna interna N°2</div>
                    <div class="columna-interna col-12 col-md-4">columna interna N°3</div>
                </div>
            </div>
            <div class=""></div>
         </div>

    </div>

     <!--Enlace del JS de Bootstrap (Debe ir siempre antes de cerrar el <body>) -->
	<!-- JS en modo local -->
	<!-- <script src="js/bootstrap.bundle.min.js"></script> -->
	<!-- JS en internet -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    
</body>
</html>
