<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <!-- Bootstrap es un framework o plantilla que facilita el uso de sistemas de rejilla responsive. Contiene en esencia tres grupos principales: sistemas de rejilla (filas y columnas), componentes(botones, textos, formularios, alertas, modales) y utilidades (colores, márgenes, rellenos, alineaciones). -->
	<!-- Página de Bootstrap https://getbootstrap.com/ -->
	<!-- Enlace Local Archivos Descargados -->
	<!-- <link rel="stylesheet" href="../Estilos/css/bootstrap.min.css"> -->
	<!--Enlace del CSS de Bootstrap (Debe ir siempre en el <head>) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<link rel="stylesheet" href="../Estilos/alinear_columnas_verticalmente.css">
</head>
<body>

    <div class="container">
        <!-- alienacion vertical individual de columnas que se unduca en la clase de cada columna -->
         <!-- aling-self: permite al.inear un elemento de manera veritcal ( en  el eje trasversal ) ignorando o sobreescribiendo la alineacion general que tenga
          el contenedor padre-->
        <!-- start: indica que el elemeto se alineara en la parte superios 
         (al inicio ) del contenedor-->
         <!-- center indica que el elemento se alineata exavtamente en el centri veryical del conetenedor sin importar como esten alineados los demanss elemnetos de la fila 
         end:indica qiue el elemnto especigico se colocata en la parte inferior (al final ) del contenedor sin importar la alineacion que tenga los demas elementes de la fila -->
    
         <!-- div,.row>div.col.align-self-start{align-self-start}*3 -->
         <div class="row">
            <div class="col align-self-start">align-self-start</div>
            <div class="col align-self-start">align-self-center</div>
            <div class="col align-self-start">align-self-end</div>
          </div>
    
          <!-- alineacion veritical grupal de colimnas que se indica en la clase de cada fila -->
           <!-- la clase items-start se aplica al contenedor padre
            alineara a rodos los elemnetos hijos que se esten dentri de esa fuka hacia la parte superior  -->

          <!-- (div.row.align-items-start>div.col*3{align-items-start})*3 -->
           <div class="row align-items-start">
            <div class="col">align-items-start</div>
            <div class="col">align-items-start</div>
            <div class="col">align-items-start</div>
           </div>
           <div class="row align-items-center">
            <div class="col">align-items-center</div>
            <div class="col">align-items-center</div>
            <div class="col">align-items-center</div>
           </div>
           <div class="row align-items-end">
            <div class="col">align-items-end</div>
            <div class="col">align-items-end</div>
            <div class="col">align-items-end</div>
           </div>
        </div>

    <!--Enlace del JS de Bootstrap (Debe ir siempre antes de cerrar el <body>) -->
	<!-- JS en modo local -->
	<!-- <script src="js/bootstrap.bundle.min.js"></script> -->
	<!-- JS en internet -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    
</body>
</html>
