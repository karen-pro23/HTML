<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campos de archivos,imagenes y ocultos</title>
</head>
<body>
    <br>
    <br>
    <br>
    <h2>Campos de archivos, imagenes y ocultos</h2>
    <form method="" action="" enctype="">
        <div>
            <label for="foto">Adjunta tu foto de perfil:</label>
            <input type="file" id="foto" name="foto">
        </div>
        <hr>
        <div>
            <label for="empresa">Empresa:</label>
            <input type="hidden" id="empresa" name="empresa" value="ingenieria" name="empresa">
        </div>
        <hr>
        <div>
            <label for="oculto">Oculto:</label>
            <input type="hidden" id="oculto" name="oculto" value="valor oculto">
        </div>
        <hr>
        <div>
            <label for="imagen">Imagen:</label>
            <input type="image" id="imagen" name="imagen" src="../../Clase1/Imagenes/Avengers Doomsday.jpg"
            name="image" alt="Inscribete en nuestris Cursos" width="30%">
        </div>
    </form>
</body>
</html>
