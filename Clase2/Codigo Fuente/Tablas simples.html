    <title>tablas simples</title>
</head>
<body>
    
    <h2>Tabla Simple</h2>
    
    <table>

        <tr>

            <td>1ra columna de la fila 1</td>
            <td>2da columna de la fila 1</td>
            <td>3ra columna de la fila 1</td>
            <td>4ta columna de la fila 1</td>
            
        </tr>
        <tr>
            <td>1ra columna de la fila 2</td>
            <td>2da columna de la fila 2</td>
        </tr>

        <tr>
            <td>1ra columna de la fila 2</td>
        </tr>
    </table>

    <!--h2{tabla simple}+table+tr>td{1ra columna de la fila 1}*4+tr>td{1ra columna de la fila 1}*2+tr>td{1ra columna de la fila 1}-->
</body>
