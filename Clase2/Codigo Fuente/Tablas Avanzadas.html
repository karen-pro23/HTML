<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas avanzadas</title>
</head>
<body>
    
    <h2>Tabla avanzadas</h2>

    <table border="3px" height="500px" width="400px" bordercolor="#001EFF">

        <thead align="left" valign="top" bgcolor="#D75FF9"></thead>
        <tr>
            <td width="50%">Cursos</td>
            <td width="25%">Inscritos Mensualmente</td>
            <td width="25%">Inscritos Anualmente</td>
        </tr>

        <tbody align="center" valign="middle" bgcolor="#E7E4E4">
        <tr>
            <td>programacion basica con python</td>
            <td>200</td>
            <td>2400</td>
        </tr>
        <tr>
            <td>robotica para niños y adolecentes</td>
            <td>100</td>
            <td>1200</td>
        </tr>
        
        </tbody>
        <tfoot align="right" valign="bottom" bgcolor="#95E9E8">
            <tr>
                <td>Total</td>
                <td>300</td>
                <td>3600</td>
            </tr>
        </tfoot>    
    </table>
</body>
</html>
