<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablad Basicas</title>
</head>
<body>
    
    <h2>Tabla Basicas</h2>
    <table border="1">
        <tr>
            <th colspan="3">curso de html y css</th>
            <!--colpan nos permite indicar cuantas columnas abarcara la celda-->
            <!--th nos permite indicar cabeceras de una fila o column-->


        </tr>
        <tr>
            <th>Modulo</th>
            <th>Clase</th>
            <th>Duracion</th>
        </tr>
        <tr>
            <td>Bienvenida</td>
            <td>introduccion iniciales</td>
            <td>00:01:50</td>
        </tr>
        <tr>
            <td rowspan="3">Instalacion de software</td> <!--rowspan nos permite indicar cuantas filas abarcara la celda-->
            <td>instalacion de XAMPP</td>
            <td>00:05:50</td>
        </tr>
        <tr>
            <td>instalacion de visual studio code</td>
            <td>00:07:50</td>
        </tr>
        <tr>
            <td>instalacion de complementos para visual studio code</td>
            <td>00:10:50</td>|
        </tr>
    </table>
</body>
</html>
